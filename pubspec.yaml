name: fieldtrust
description: Trusted proof from the field.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shadcn_ui: ^0.56.3
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  geolocator: ^13.0.2
  camera: ^0.11.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Add voice / AI integrations only after the core capture flow is reliable.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
